<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Meme Generator</title>
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="stylesheet" type="text/css" href="/generic.css"/>

    <script src="/generic.js"></script>

    <script src="/custom-elements/icon.js"></script>
    <script src="/custom-elements/header.js"></script>
    <script type="module" src="/custom-elements/separator.mjs"></script>
    <script type="module" src="/custom-elements/select.mjs"></script>
    <script type="module" src="/custom-elements/tabs.mjs"></script>
    <script type="module" src="/custom-elements/accordion.mjs"></script>

    <script type="module" src="index.mjs"></script>
  </head>
  <body class="w80 center center-text">
    <c-header>
      <lhs>
        <c-header-icon>home</c-header-icon>
        <c-header-icon title="Back to 'Tools'">back</c-header-icon>
      </lhs>
      <center>Meme generator</center>
    </c-header>

    <c-separator></c-separator>

    <div class="flex justify-content-center">
      <div class="w80 p5p bg0-1 flex align-center justify-content-center">
        <canvas id="current-image" class="maxw100"></canvas>
      </div>
      <div class="w-fit-content ml5p">
        <c-tabs id="sidebar">
          <tab id="existing" title="Existing" selected>
            <c-select id="template-select" label="Template:" faded></c-select>

            <c-separator></c-separator>

            <div id="modifier-container"></div>

            <button id="add-modifier" class="mt15p"><c-icon>plus</c-icon> Add another modifier</button>

            <c-separator faded></c-separator>

            <div class="mt15p mb15p flex space-around">
              <button id="generate" class="big green">Generate</button>
              <button id="save" class="big">Save</button>
            </div>
          </tab>

          <tab id="custom" title="Custom" disabled="Coming soon!"><!-- TODO --></tab>
        </c-tabs>
      </div>
    </div>
  </body>
</html>
